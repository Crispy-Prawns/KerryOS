if(!S.fr)S.fr=[];if(!S.dis)S.dis=[];
function tdoc(id){for(var i=0;i<town.length;i++)if(town[i].id===id)return town[i];return null}

function mergeFr(){if(synced)return;var me=tdoc(uid);if(!me&&!town.length)return;synced=1;if(!S.fr.length&&me&&Array.isArray(me.fr)){S.fr=me.fr.slice();save()}}
function need(ids){var m=ids.filter(function(i){return i&&!asked[i]&&i!==uid});if(!m.length||!UP)return;m.forEach(function(i){asked[i]=1});try{UP.profiles(m).then(function(r){for(var k in r)profs[k]=r[k].name||"";drawFriends();drawChat()}).catch(function(){})}catch(e){}}

function dropFriend(id){S.fr=S.fr.filter(function(x){return x!==id});if(S.rf===id)S.rf=null;save();lastSent="";pushTown();drawFriends();drawMap()}

function treatTo(id){if(!db||!uid){say("Treats work on the published page when you’re signed in.","🥺","Okay");return}if(myTreats().indexOf(id)>-1){say("You already sent a treat today. 🐟","😽","Okay");return}sendTreat(id);say("Treat sent to "+petName(tdoc(id))+". 🐟 They’ll see it next time they open KerryOS.","😽","Aww")}
function openChatTo(id){var d=tdoc(id);chatOpen=true;$("chat").hidden=false;$("cbtn").textContent="💬";$("cfo").checked=isFriend(id);setReply(null);$("ci").value="Hey "+petName(d)+"! ";drawChat();$("ci").focus()}
function friendScore(day){var d=tdoc(S.rf);if(!d)return 0;if(new Date(+d.upd||0).toLocaleDateString("en-CA")!==(day||today()))return 0;return +d.total?Math.round((+d.done||0)/d.total*100):0}
var _rn=rivalNow,_rf=rivalFinal;rivalNow=function(){return S.rf?friendScore():_rn()};rivalFinal=function(day){return S.rf?friendScore(day):_rf(day)};
function raceFriend(id){var d=tdoc(id);if(!d)return;S.rf=id;S.rival={name:petName(d),species:PETS[d.pet]?d.pet:"cat",coat:"honey",pers:"softie"};save();drawRace();showTab(2);say("Race on! "+S.rival.name+" is your rival today. Finish ahead by midnight. 🏁","😼","Bring it")}
function frRow(id,d,acts){var r=document.createElement("div");r.className="goal";var t=document.createElement("span");t.className="t";var b=document.createElement("b");b.innerHTML=(d&&PETS[d.pet]?pic(d.pet,24)+" ":"🐾 ")+esc(d?petName(d):(realName(id)||"A neighbour"));t.appendChild(b);

sub.textContent=(d&&realName(id)?realName(id)+" · ":"")+(online[id]?"🟢 online now":(d?(age<864e5?"active today":(age<1728e5?"💤 quiet 1d":"⚠️ unresponsive "+Math.floor(age/864e5)+"d")):"hasn’t joined the town yet"));t.appendChild(sub);r.appendChild(t);
acts.forEach(function(a){var x=document.createElement("button");x.className="chip";x.textContent=a[0];x.title=a[1];if(a[2])x.onclick=a[2];else x.disabled=true;r.appendChild(x)});return r}

$("t4").textContent="👥 Friends"+(inc.length?" ("+inc.length+")":"");need(inc.map(function(v){return v.id}).concat(S.fr));

else if(!fl.length)el.innerHTML='<div class="empty">No friends yet. Search for someone above and send a request! 💛</div>';

sent.forEach(function(id){var d=tdoc(id),r=frRow(id,d,[["Cancel","Cancel request",function(){dropFriend(id)}]]);r.querySelector(".small").textContent="⏳ Waiting for them to accept"+(realName(id)?" · "+realName(id):"");rq.appendChild(r)})}

try{UP.search(q).then(function(hs){el.innerHTML="";hs=hs.filter(function(h){return h.id!==uid}).slice(0,8);if(!hs.length){el.textContent="No one found. They may need access to this page first.";return}
hs.forEach(function(h){profs[h.id]=h.name||"";var d=tdoc(h.id),act=isFriend(h.id)?["💛 Friends","",null]:(S.fr.indexOf(h.id)>-1?["⏳ Requested","",null]:["➕ Add","Send friend request",function(){addFriend(h.id);doSearch($("fq").value.trim())}]);
var r=frRow(h.id,d,[act]);el.appendChild(r)})}).catch(function(){el.textContent="Search isn’t available right now."})}catch(e){el.textContent="Search isn’t available right now."}}
