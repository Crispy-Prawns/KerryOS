function renderRace(){
  var you=score(),rv=rivalNow(),d=you-rv;
  $("raceSub").textContent='vs '+S.rival.name+' the '+(S.rival.species==='cat'?'cat':'dog')+', '+PERS[S.rival.pers].label+'. Finish ahead by midnight to win a honey pot.';
  $("lanes").innerHTML=lane(YOU().name+' (you)',you,YOU().species,YOU().coat,'ym','happy')+lane(S.rival.name,rv,S.rival.species,S.rival.coat,'rm',d>=0?'grumpy':'happy');
  $("lead").textContent=d>0?'You lead by '+d+'. Keep it up.':d<0?S.rival.name+' leads by '+(-d)+'. One more goal closes the gap.':'Neck and neck.';
  var last=S.history.slice(-7);
  $("days").innerHTML=last.length?last.map(function(x){
    var l=new Date(x.d+'T12:00:00').toLocaleDateString(undefined,{weekday:'narrow'});
    return '<span class="dot '+(x.w?'w':'l')+'" title="'+x.d+': you '+x.you+', rival '+x.rv+'" aria-label="'+x.d+(x.w?' won':' lost')+'">'+l+'</span>';
  }).join(''):'<span class="sub">No finished days yet. Today is day one.</span>';
}
(function(){
  var sky=$("sky"),em=['🧈','🥞','🧀','♡','✨','🍯','☁️','꒱','˚','༘','𓈒','*'];
  for(var i=0;i<24;i++){
    var s=document.createElement('span');s.textContent=em[i%em.length];
    s.style.left=rnd(0,96)+'%';s.style.fontSize=rnd(20,44)+'px';
    s.style.animationDuration=rnd(26,52)+'s';s.style.animationDelay=(-rnd(0,50))+'s';
    s.style.bottom=rnd(-60,40)+'vh';
    sky.appendChild(s);
  }
})();
var PERS={diva:{label:'Diva'},drill:{label:'Drill Sergeant'},softie:{label:'Soft Touch'},gremlin:{label:'Gremlin'}};
function score(){var n=S.goals.length;if(!n)return 0;return Math.round(S.goals.filter(function(x){return x.done}).length/n*100)}
function YOU(){return{name:S.name||dn(),species:S.pet||"cat",coat:"honey"}}
function mk(sp,coat,mood){return(sp==="cat"||sp==="dog")?miniHead(sp,coat,mood):'<div style="font-size:30px;line-height:40px;text-align:center">'+(PETS[sp]?PETS[sp].e:"🐾")+'</div>'}
function recordRace(){var you=score(),rv=rivalFinal(S.day),w=you>=rv&&you>0;S.history.push({d:S.day,you:you,rv:rv,w:w});if(w)S.honey++;if(S.history.length>60)S.history.shift()}
function drawStage(){var Y=YOU(),sc=score(),d=rivalNow()-sc,left=S.goals.filter(function(x){return !x.done}).length;
var ym=S.sleep?"sleep":(sc>=80?"happy":(hourNow()>=14&&sc<40?"grumpy":"awake")),rm=d>5?"happy":(d<-8?"grumpy":"awake");
var py=$("petYou"),pr=$("petRival");
py.innerHTML=(Y.species==="cat"||Y.species==="dog")?petSVG(Y.species,Y.coat,ym,false):'<div style="font-size:90px;line-height:1.1;text-align:center">'+PETS[Y.species].e+'</div>';py.className="pet "+ym+(ym==="happy"?" awake":"");
pr.innerHTML=petSVG(S.rival.species,S.rival.coat,rm,true);pr.className="pet "+rm+(rm==="happy"?" awake":"");
$("nameYou").textContent=Y.name;$("nameRival").textContent="Rival "+S.rival.name;
$("honeyCount").textContent=S.honey+(S.honey===1?" pot":" pots");
$("sceneSub").textContent=quiet()?"Quiet hours. Everyone is napping.":(left?left+(left===1?" goal":" goals")+" left today.":"All goals done. Naps earned.")}
function drawRace(){renderStats();renderRace();drawStage()}
if(!S.rival)S.rival=makeRival(dn());if(!S.history)S.history=[];if(!S.honey)S.honey=0;
$("newRival").onclick=function(){S.rival=makeRival(YOU().name);save();drawRace();say("New rival in town: "+S.rival.name+" the "+S.rival.species+".","😼","Bring it")};
$("t3").onclick=function(){showTab(2)};
setInterval(drawRace,30000);
function closeMenu(){var o=$("pm");if(o)o.remove()}
function showMenu(v,ev,st,age){closeMenu();var npc=!v.id,nm=String(v.name||"Pet").slice(0,16),dd=Math.floor(age/864e5);
var p=document.createElement("div");p.id="pm";
var h=document.createElement("b");h.textContent=(PETS[v.pet]?PETS[v.pet].e+" ":"")+nm;p.appendChild(h);
var t=document.createElement("div");t.className="small";t.style.color="var(--muted)";
t.textContent=(st===2?"⚠️ Unresponsive for "+dd+"+ days":(st===1?"💤 Quiet for about a day":"Active recently"))+(npc?" · town resident (NPC)":"");p.appendChild(t);
function btn(label,fn,off,ghost){var b=document.createElement("button");b.textContent=label;if(ghost)b.className="g";if(off)b.disabled=true;b.onclick=function(e){e.stopPropagation();closeMenu();fn&&fn()};p.appendChild(b)}
var sent=!npc&&myTreats().indexOf(v.id)>-1;
btn(sent?"🐟 Treat sent ✓":"🐟 Send a treat",function(){
 if(npc){npcRespond("",{npc:1,n:nm},"treat");say("You sent "+nm+" a treat. 🐟 Check the town chat for their reply.","😽","Aww");return}
 if(!db||!uid){say("Treats work on the published page when you’re signed in.","🥺","Okay");return}
 sendTreat(v.id);say("Treat sent to "+nm+". 🐟 They’ll see it next time they open KerryOS.","😽","Aww")},sent);
btn("💬 Send a message",function(){
 chatOpen=true;$("chat").hidden=false;$("cbtn").textContent="💬";setReply(null);$("ci").value="Hey "+nm+", thinking of you! "+(npc?"How’s your day going?":"Hope you’re doing okay.")+" 💛";drawChat();$("ci").focus()});
btn("Close",null,false,true);
document.body.appendChild(p);
var w=p.offsetWidth||220,hh=p.offsetHeight||170;
p.style.left=Math.max(8,Math.min(ev.clientX-w/2,innerWidth-w-8))+"px";p.style.top=Math.max(8,Math.min(ev.clientY+10,innerHeight-hh-8))+"px"}
document.addEventListener("click",function(e){var m=$("pm");if(m&&!m.contains(e.target))closeMenu()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeMenu()});
updPet();drawPets();
drawLib();
rollover();render();
if(!S.goals.length)say(WELCOME,"🐱","Let’s go");

</script>
</body></html>
